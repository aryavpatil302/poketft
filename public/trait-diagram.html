<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trait Diagram Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14161c; font-family: sans-serif; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 1000;
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: #1c1f28; border-bottom: 1px solid #333947; color: #dde;
  }
  #toolbar h1 { font-size: 14px; font-weight: bold; color: #9db4ff; margin-right: 4px; white-space: nowrap; }
  #toolbar button {
    padding: 7px 14px; border-radius: 6px; border: 1px solid #454c5c; background: #262a35;
    color: #cdd6ea; font-size: 12px; font-weight: bold; cursor: pointer;
  }
  #toolbar button:hover { background: #313644; }
  #btn-save { background: #1c5c33; border-color: #2f9c56; color: #b9f2cc; }
  #btn-save:hover { background: #227a41; }
  #btn-save:disabled { opacity: 0.5; cursor: default; background: #1c5c33; }
  #status { font-size: 12px; color: #8fa; margin-left: 2px; }
  #status.err { color: #f88; }
  #search {
    padding: 6px 10px; border-radius: 6px; border: 1px solid #454c5c; background: #12141a;
    color: #dde; font-size: 12px; width: 160px;
  }
  #selection-bar {
    position: fixed; top: 52px; left: 0; right: 0; height: 34px; z-index: 999;
    display: none; align-items: center; gap: 10px; padding: 0 14px;
    background: #20242f; border-bottom: 1px solid #333947; color: #e8b04e; font-size: 12px;
  }
  #selection-bar b { color: #fff; }
  #selection-bar .hint { color: #778; font-weight: normal; }

  #canvas-outer { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; overflow: auto; }
  #canvas {
    position: relative; width: 6200px; height: 4200px;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  svg#lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  svg#lines line { transition: opacity 0.15s ease, stroke-width 0.15s ease; }
  svg#lines line.dim { opacity: 0.05; }
  svg#lines line.bright { opacity: 0.9; }

  .trait-circle {
    position: absolute; border-radius: 50%; cursor: grab; user-select: none;
    display: flex; align-items: flex-start; justify-content: center;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .trait-circle:active { cursor: grabbing; }
  .trait-circle.dragging { z-index: 500; }
  .trait-circle.selectable { cursor: pointer; }
  .trait-circle.selectable:hover { box-shadow: 0 0 0 3px #fff8, inset 0 0 30px rgba(255,255,255,0.15); }
  .trait-circle.dim { opacity: 0.25; }
  .trait-circle.has-unit { box-shadow: inset 0 0 0 2px currentColor; }
  /* Traits (the 10 regions: jungle/volcanic/beachy/...) hold units by literal
     containment and stay put by default. Origins (everything else) are the
     rearrangeable layer, shown only via connector line — dashed border
     (set inline per-circle in JS, alongside the color, since an inline
     `border` shorthand always wins over this class rule) marks them as
     visually distinct from Traits. */
  .trait-label {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: bold; letter-spacing: 0.02em; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6); pointer-events: none;
  }
  .trait-kind {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55;
    pointer-events: none;
  }
  .trait-count {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: bold; opacity: 0.35; pointer-events: none;
  }
  .resize-handle {
    position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px;
    border-radius: 4px; background: #0006; border: 1px solid currentColor;
    cursor: nwse-resize;
  }

  .unit-icon {
    position: absolute; width: 56px; z-index: 10; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    transition: opacity 0.15s ease;
  }
  .unit-icon:active { cursor: grabbing; }
  .unit-icon.dragging { z-index: 600; }
  .unit-icon.dimmed { opacity: 0.15; }
  .unit-icon.selected img { outline: 3px solid #e8b04e; border-radius: 50%; outline-offset: 2px; }
  .unit-icon img {
    width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated;
    pointer-events: none;
  }
  .unit-icon .uname {
    font-size: 9px; color: #eef; background: rgba(10,12,18,0.75); padding: 1px 4px;
    border-radius: 3px; white-space: nowrap; pointer-events: none;
  }
  .unit-icon .utraits {
    font-size: 8px; color: #9db4ff; background: rgba(10,12,18,0.75); padding: 0 4px;
    border-radius: 3px; white-space: nowrap; pointer-events: none; max-width: 140px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .unit-icon.zero-traits .utraits { color: #ff8888; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #778; font-size: 14px; z-index: 2000;
  }
</style>
</head>
<body>

<div id="loading">Loading units &amp; traits…</div>

<div id="toolbar" style="display:none;">
  <h1>Trait Diagram Editor</h1>
  <button id="btn-reset-layout">↺ Reset positions</button>
  <button id="btn-regrid">▦ Re-grid circles</button>
  <input id="search" type="text" placeholder="Highlight a unit…" />
  <button id="btn-save">💾 Save to units.ts</button>
  <span id="status"></span>
</div>
<div id="selection-bar">
  <span>Editing <b id="sel-name"></b> — <b id="sel-traits"></b></span>
  <span class="hint">click a Trait (solid) or Origin (dashed) circle to set it — each unit gets one of each · click the unit again (or empty space) to stop editing</span>
</div>

<div id="canvas-outer">
  <div id="canvas">
    <svg id="lines"></svg>
  </div>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'pokeTFT_trait_diagram_v3';
  const canvas = document.getElementById('canvas');
  const linesSvg = document.getElementById('lines');
  const canvasOuter = document.getElementById('canvas-outer');

  // The 10 "Trait" (region) ids — every unit has exactly one, and they never
  // co-occur with each other, so units can sit directly INSIDE their Trait's
  // circle (no overlap needed). Everything else is an "Origin" — the
  // rearrangeable layer, shown only via a connector line since a single
  // Origin can pair with many different Traits (real circle overlap for that
  // many simultaneous pairs isn't geometrically possible — see connector-line
  // redesign).
  const REGION_IDS = new Set([
    'jungle', 'volcanic', 'beachy', 'sky_striker', 'cave_crawler',
    'river', 'temporal_woods', 'ruiner', 'ascender', 'froststone',
  ]);

  let TRAITS = [];   // [{id, name, isRegion}]
  let UNITS  = [];   // [{id, name, cost, spritePath, extra:[]}]  (extra = non-circle tags, always preserved)
  let circleState = new Map();   // traitId -> {x, y, r}
  let unitState    = new Map();  // unitId -> {x, y}
  let unitTraits   = new Map();  // unitId -> Set(traitId)  — THE editable source of truth
  let selectedUnit = null;

  function isRegion(traitId) { return REGION_IDS.has(traitId); }
  function regionOf(unitId) {
    for (const t of unitTraits.get(unitId)) if (isRegion(t)) return t;
    return null;
  }

  function hueFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360;
    return h;
  }

  // ── Data load ────────────────────────────────────────────────────────────
  fetch('/api/trait-diagram-data')
    .then(r => r.json())
    .then(data => {
      TRAITS = data.traits.map(t => ({ ...t, isRegion: isRegion(t.id) }))
        .sort((a, b) => (b.isRegion - a.isRegion) || a.name.localeCompare(b.name));
      const traitIdSet = new Set(TRAITS.map(t => t.id));
      UNITS = data.units.map(u => ({
        ...u,
        savedTypes: u.types,
        extra: u.types.filter(t => !traitIdSet.has(t)),
      }));
      init();
    })
    .catch(err => {
      document.getElementById('loading').textContent =
        'Failed to load — is the Vite dev server (npm run dev) running? ' + err;
    });

  function init() {
    loadLayoutOrDefault();
    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
  }

  // ── Default layout ──────────────────────────────────────────────────────
  // Traits (regions) get one clean row across the top, radius sized to how
  // many units they hold so everyone actually fits inside. Origins sit in a
  // grid below — fixed size, since they're a line-based (not containment)
  // relationship and don't need to hold anyone.
  function defaultCircleLayout() {
    circleState = new Map();
    const regionCount = new Map();
    for (const t of TRAITS) if (t.isRegion) regionCount.set(t.id, 0);
    for (const u of UNITS) { const r = regionOf(u.id); if (r) regionCount.set(r, regionCount.get(r) + 1); }

    const regions = TRAITS.filter(t => t.isRegion);
    const regionR = id => 105 + Math.min(8, regionCount.get(id) || 0) * 13;
    const maxRegionR = Math.max(...regions.map(t => regionR(t.id)), 130);
    const spacing = maxRegionR * 2 + 90;
    regions.forEach((t, i) => {
      circleState.set(t.id, { x: 280 + i * spacing, y: 280, r: regionR(t.id) });
    });

    const origins = TRAITS.filter(t => !t.isRegion);
    const originTop = 280 + maxRegionR + 190;
    const cols = 6, oSpacing = 300, oR = 110;
    origins.forEach((t, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      circleState.set(t.id, { x: 280 + col * oSpacing, y: originTop + row * oSpacing, r: oR });
    });
  }

  // Packs a region's units into a simple grid inside its circle — literal
  // containment, so "current traits" is true by construction, no physics.
  function packRegion(regionId, units) {
    const c = circleState.get(regionId);
    const cols = Math.max(1, Math.min(4, Math.ceil(Math.sqrt(units.length))));
    const cellW = 78, cellH = 82;
    const rows = Math.ceil(units.length / cols);
    const startX = c.x - (cols - 1) * cellW / 2;
    const startY = c.y - (rows - 1) * cellH / 2 + 18;   // nudge below the label
    units.forEach((u, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      unitState.set(u.id, { x: startX + col * cellW, y: startY + row * cellH });
    });
  }

  function defaultUnitLayout() {
    unitState = new Map();
    const byRegion = new Map();
    const orphans = [];
    for (const u of UNITS) {
      const r = regionOf(u.id);
      if (r) { if (!byRegion.has(r)) byRegion.set(r, []); byRegion.get(r).push(u); }
      else orphans.push(u);
    }
    for (const [regionId, units] of byRegion) packRegion(regionId, units);
    // Units with no Trait assigned yet (shouldn't normally happen) go in a
    // neutral holding row below everything else.
    orphans.forEach((u, i) => {
      unitState.set(u.id, { x: 300 + (i % 12) * 90, y: 3600 + Math.floor(i / 12) * 90 });
    });
  }

  // Re-run after a Trait toggle so the unit visually jumps into its new
  // bubble (or a neutral spot just below it if cleared entirely).
  function snapUnitIntoRegion(unitId) {
    const r = regionOf(unitId);
    const c = r ? circleState.get(r) : null;
    if (c) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * c.r * 0.55;
      unitState.set(unitId, { x: c.x + Math.cos(angle) * dist, y: c.y + Math.sin(angle) * dist + 20 });
    }
  }

  function defaultUnitTraits() {
    unitTraits = new Map();
    const traitIdSet = new Set(TRAITS.map(t => t.id));
    UNITS.forEach(u => unitTraits.set(u.id, new Set(u.savedTypes.filter(t => traitIdSet.has(t)))));
  }

  function loadLayoutOrDefault() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}

    defaultUnitTraits();
    defaultCircleLayout();
    defaultUnitLayout();

    if (saved && saved.circles && saved.units) {
      for (const [id, c] of Object.entries(saved.circles)) {
        if (circleState.has(id)) circleState.set(id, c);
      }
      for (const [id, p] of Object.entries(saved.units)) {
        if (unitState.has(id)) unitState.set(id, p);
      }
      if (saved.unitTraits) {
        for (const [id, arr] of Object.entries(saved.unitTraits)) {
          if (unitTraits.has(id)) unitTraits.set(id, new Set(arr));
        }
      }
    }
  }

  function persist() {
    const circles = {}; for (const [k, v] of circleState) circles[k] = v;
    const units = {};   for (const [k, v] of unitState) units[k] = v;
    const ut = {};      for (const [k, v] of unitTraits) ut[k] = [...v];
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ circles, units, unitTraits: ut }));
  }

  // ── Rendering ────────────────────────────────────────────────────────────
  let circleEls = new Map();
  let unitEls = new Map();

  function circleEdgePoint(c, towardX, towardY) {
    const dx = towardX - c.x, dy = towardY - c.y;
    const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    return { x: c.x + (dx / d) * c.r, y: c.y + (dy / d) * c.r };
  }

  function render() {
    canvas.innerHTML = '';
    canvas.appendChild(linesSvg);
    circleEls = new Map();
    unitEls = new Map();

    for (const t of TRAITS) {
      const c = circleState.get(t.id);
      const hue = hueFor(t.id);
      const el = document.createElement('div');
      el.className = 'trait-circle selectable' + (t.isRegion ? '' : ' origin');
      el.dataset.trait = t.id;
      el.style.left = (c.x - c.r) + 'px';
      el.style.top  = (c.y - c.r) + 'px';
      el.style.width = el.style.height = (c.r * 2) + 'px';
      el.style.background = `hsla(${hue},70%,55%,0.13)`;
      // Border STYLE set explicitly here too (not left to the .origin CSS
      // class) — an inline `border` shorthand always overrides a stylesheet
      // border-style rule regardless of specificity, since it's shorthand.
      el.style.border = `2px ${t.isRegion ? 'solid' : 'dashed'} hsla(${hue},70%,60%,0.85)`;
      el.style.color = `hsl(${hue},80%,78%)`;

      const label = document.createElement('div');
      label.className = 'trait-label';
      label.textContent = t.name;
      label.style.color = `hsl(${hue},85%,82%)`;
      el.appendChild(label);

      const kind = document.createElement('div');
      kind.className = 'trait-kind';
      kind.textContent = t.isRegion ? 'Trait' : 'Origin';
      kind.style.color = `hsl(${hue},85%,82%)`;
      el.appendChild(kind);

      const count = document.createElement('div');
      count.className = 'trait-count';
      el.appendChild(count);

      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.style.color = `hsl(${hue},70%,60%)`;
      el.appendChild(handle);

      canvas.appendChild(el);
      circleEls.set(t.id, el);
      wireCircleDrag(el, handle, t.id);
      el.addEventListener('click', (e) => onCircleClick(e, t.id));
    }

    for (const u of UNITS) {
      const p = unitState.get(u.id);
      const el = document.createElement('div');
      el.className = 'unit-icon';
      el.dataset.unit = u.id;
      el.style.left = (p.x - 28) + 'px';
      el.style.top  = (p.y - 28) + 'px';
      el.innerHTML =
        `<img src="${u.spritePath}" onerror="this.style.display='none'">` +
        `<div class="uname">${u.name}</div>` +
        `<div class="utraits"></div>`;
      canvas.appendChild(el);
      unitEls.set(u.id, el);
      wireUnitDrag(el, u.id);
    }

    refreshAll();
  }

  function refreshAll() {
    // trait circle "N units" counters
    const perTraitCount = new Map();
    for (const t of TRAITS) perTraitCount.set(t.id, 0);
    for (const u of UNITS) for (const t of unitTraits.get(u.id)) perTraitCount.set(t, (perTraitCount.get(t) || 0) + 1);
    for (const t of TRAITS) {
      const el = circleEls.get(t.id);
      el.querySelector('.trait-count').textContent = perTraitCount.get(t.id);
    }

    // unit labels + position (position sync matters here: snapUnitIntoRegion
    // updates unitState directly without touching the DOM itself) + zero-trait flag
    for (const u of UNITS) {
      const el = unitEls.get(u.id);
      const p = unitState.get(u.id);
      el.style.left = (p.x - 28) + 'px';
      el.style.top  = (p.y - 28) + 'px';
      const ts = [...unitTraits.get(u.id)];
      const traitsEl = el.querySelector('.utraits');
      traitsEl.textContent = ts.length ? ts.join(', ') : '(none)';
      el.title = `${u.name} — cost ${u.cost}` +
        (u.extra.length ? `\nnon-diagram tag(s), always kept: ${u.extra.join(', ')}` : '');
      el.classList.toggle('zero-traits', ts.length === 0 && u.extra.length === 0);
      el.classList.toggle('selected', u.id === selectedUnit);
    }

    drawLines();
  }

  function drawLines() {
    linesSvg.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (const u of UNITS) {
      const p = unitState.get(u.id);
      for (const traitId of unitTraits.get(u.id)) {
        if (isRegion(traitId)) continue;   // shown by containment instead — see packRegion/snapUnitIntoRegion
        const c = circleState.get(traitId);
        if (!c) continue;
        const edge = circleEdgePoint(c, p.x, p.y);
        const hue = hueFor(traitId);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
        line.setAttribute('x2', edge.x); line.setAttribute('y2', edge.y);
        line.setAttribute('stroke', `hsl(${hue},75%,65%)`);
        line.setAttribute('stroke-width', selectedUnit === u.id ? '2.5' : '1.2');
        line.setAttribute('opacity', selectedUnit === u.id ? '0.95' : '0.35');
        line.dataset.unit = u.id;
        line.dataset.trait = traitId;
        frag.appendChild(line);
      }
    }
    linesSvg.appendChild(frag);
  }

  // ── Selection / editing ─────────────────────────────────────────────────
  function selectUnit(unitId) {
    selectedUnit = unitId;
    const bar = document.getElementById('selection-bar');
    if (unitId) {
      const u = UNITS.find(x => x.id === unitId);
      bar.style.display = 'flex';
      document.getElementById('sel-name').textContent = u.name;
      updateSelTraitsLabel();
      canvasOuter.style.top = '86px';   // 52px toolbar + 34px selection bar
    } else {
      bar.style.display = 'none';
      canvasOuter.style.top = '52px';
    }
    refreshAll();
  }

  function updateSelTraitsLabel() {
    if (!selectedUnit) return;
    const ts = [...unitTraits.get(selectedUnit)];
    document.getElementById('sel-traits').textContent = ts.length ? ts.join(', ') : '(no traits yet)';
  }

  // Radio-style within each category — a unit has exactly one Trait (region)
  // and, per the real game data, effectively one Origin too. Clicking the
  // circle it's already in clears it; clicking another swaps it in.
  function onCircleClick(e, traitId) {
    if (!selectedUnit) return;
    e.stopPropagation();
    const set = unitTraits.get(selectedUnit);
    const region = isRegion(traitId);
    if (set.has(traitId)) {
      set.delete(traitId);
    } else {
      for (const t of [...set]) if (isRegion(t) === region) set.delete(t);
      set.add(traitId);
    }
    if (region) snapUnitIntoRegion(selectedUnit);
    updateSelTraitsLabel();
    persist();
    refreshAll();
  }

  canvas.addEventListener('click', (e) => {
    if (e.target === canvas || e.target === linesSvg) selectUnit(null);
  });

  // ── Drag: circles (move + resize) ───────────────────────────────────────
  function wireCircleDrag(el, handle, traitId) {
    el.addEventListener('pointerdown', (e) => {
      if (e.target === handle) return;
      const c = circleState.get(traitId);
      const startX = e.clientX, startY = e.clientY;
      const origX = c.x, origY = c.y;
      let moved = false;

      function onMove(ev) {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; el.classList.add('dragging'); }
        if (!moved) return;
        c.x = origX + dx; c.y = origY + dy;
        el.style.left = (c.x - c.r) + 'px';
        el.style.top  = (c.y - c.r) + 'px';
        drawLines();
      }
      function onUp(ev) {
        el.releasePointerCapture(ev.pointerId);
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        if (moved) persist();
      }
      el.setPointerCapture(e.pointerId);
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
    });

    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      const c = circleState.get(traitId);

      function onMove(ev) {
        const rect = el.getBoundingClientRect();
        const dx = ev.clientX - (rect.left + c.r);
        const dy = ev.clientY - (rect.top + c.r);
        c.r = Math.max(40, Math.round(Math.sqrt(dx * dx + dy * dy)));
        el.style.left = (c.x - c.r) + 'px';
        el.style.top  = (c.y - c.r) + 'px';
        el.style.width = el.style.height = (c.r * 2) + 'px';
        drawLines();
      }
      function onUp(ev) {
        handle.releasePointerCapture(ev.pointerId);
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        persist();
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  }

  // ── Drag: units (click = select/edit, drag = reposition only) ──────────
  function wireUnitDrag(el, unitId) {
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      const p = unitState.get(unitId);
      const startX = e.clientX, startY = e.clientY;
      const origX = p.x, origY = p.y;
      let moved = false;

      function onMove(ev) {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; el.classList.add('dragging'); }
        if (!moved) return;
        p.x = origX + dx; p.y = origY + dy;
        el.style.left = (p.x - 28) + 'px';
        el.style.top  = (p.y - 28) + 'px';
        drawLines();
      }
      function onUp(ev) {
        el.releasePointerCapture(ev.pointerId);
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        if (moved) { persist(); }
        else {
          e.stopPropagation();
          selectUnit(selectedUnit === unitId ? null : unitId);
        }
      }
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
    });
  }

  // ── Toolbar ──────────────────────────────────────────────────────────────
  document.getElementById('btn-reset-layout').addEventListener('click', () => {
    if (!confirm('Reset circle and unit positions back to the default layout? (trait assignments are kept)')) return;
    defaultCircleLayout();
    defaultUnitLayout();
    persist();
    render();
  });

  document.getElementById('btn-regrid').addEventListener('click', () => {
    if (!confirm('Re-grid the trait circles (keeps unit positions and trait assignments)?')) return;
    defaultCircleLayout();
    persist();
    render();
  });

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    for (const u of UNITS) {
      const el = unitEls.get(u.id);
      if (!el) continue;
      el.classList.toggle('dimmed', q.length > 0 && !u.name.toLowerCase().includes(q));
    }
  });

  document.getElementById('btn-save').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save');
    const status = document.getElementById('status');
    const traitsByUnit = {};
    let zeroCount = 0;
    for (const u of UNITS) {
      const live = [...unitTraits.get(u.id)];
      if (live.length === 0 && u.extra.length === 0) zeroCount++;
      traitsByUnit[u.id] = [...live, ...u.extra];
    }
    if (zeroCount > 0 &&
        !confirm(`${zeroCount} unit(s) have NO traits assigned and would be saved with an empty list. Continue anyway?`)) {
      return;
    }

    btn.disabled = true;
    status.textContent = 'Saving…';
    status.className = '';
    try {
      const res = await fetch('/api/save-traits', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ traits: traitsByUnit }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'unknown error');
      status.textContent = `✓ Saved — ${data.changed} unit(s) updated in units.ts`;
      status.className = '';
      UNITS.forEach(u => { u.savedTypes = traitsByUnit[u.id]; });
    } catch (err) {
      status.textContent = '✗ Save failed: ' + err.message;
      status.className = 'err';
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
